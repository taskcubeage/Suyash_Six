name: Sync Team Development to Company Development

on:
  push:
    branches:
      - development

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Team Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false    # DO NOT let GITHUB_TOKEN remain in credential helper
          fetch-depth: 0

      - name: Ensure COMPANY_PAT is set
        run: |
          if [ -z "${{ secrets.COMPANY_PAT }}" ]; then
            echo "Error: COMPANY_PAT secret is not set or empty. Add a valid PAT to repository secrets."
            exit 1
          fi

      - name: Push to Company Repository
        env:
          COMPANY_PAT: ${{ secrets.COMPANY_PAT }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote add company https://x-access-token:${COMPANY_PAT}@github.com/suyash7172/Suyash_Six.git
          # Force only if you intend to overwrite remote branch history; otherwise omit --force
          git push company development